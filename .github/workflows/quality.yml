name: Quality

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Lint, check, test, and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check Svelte and TypeScript
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
